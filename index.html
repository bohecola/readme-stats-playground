<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A visual playground for github-readme-stats: tweak card parameters, preview live, and copy the code into your README."
    />
    <title>README Stats Playground</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <!-- Absolute-URL tags (canonical, og:url, og:image, JSON-LD) are injected at build time from VITE_SITE_URL; see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="README Stats Playground" />
    <meta property="og:title" content="README Stats Playground" />
    <meta
      property="og:description"
      content="Visual playground for github-readme-stats cards: tweak parameters, preview live, copy the Markdown for your GitHub profile README."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="README Stats Playground" />
    <meta
      name="twitter:description"
      content="Visual playground for github-readme-stats cards: tweak parameters, preview live, copy the Markdown for your GitHub profile README."
    />
    <script>
      // Apply the saved (or system) theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("rsp:theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
